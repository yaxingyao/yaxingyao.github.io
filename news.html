<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News - Yaxing Yao</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-container">
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="publications.html">Publications</a></li>
          <li><a href="grants.html">Grants</a></li>
          <li><a href="teaching.html">Teaching</a></li>
          <li><a href="news.html" class="active">News</a></li>
          <li><a href="misc.html">Misc.</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="container-narrow">
        <h1 class="mb-8">News</h1>
        
        <div id="news-container"></div>

      </div>
    </main>

    <footer>
      <div class="container">
        © <span id="current-year"></span> All rights reserved.
      </div>
    </footer>
  </div>

  <script src="data/newsData.js"></script>
  <script>
    const container = document.getElementById('news-container');
    
    newsItems.forEach(item => {
      const newsDiv = document.createElement('div');
      newsDiv.className = 'news-timeline';
      
      newsDiv.innerHTML = `
        <div class="news-date mb-2">${item.date}</div>
        <p class="text-gray-700 leading-relaxed">${item.content}</p>
      `;
      
      container.appendChild(newsDiv);
    });

    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
