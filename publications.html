<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications - Yaxing Yao</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="site-container">
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="publications.html" class="active">Publications</a></li>
          <li><a href="grants.html">Grants</a></li>
          <li><a href="teaching.html">Teaching</a></li>
          <li><a href="news.html">News</a></li>
          <li><a href="misc.html">Misc.</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="container-narrow">
        <h1 class="mb-8">Publications</h1>
        
        <div class="mb-8">
          <p class="text-gray-700 leading-relaxed">
            For a complete list of publications, please visit my 
            <a href="https://scholar.google.com/citations?user=zt8mnzgAAAAJ&hl=en&oi=ao" class="text-gray-900" style="text-decoration: underline;">Google Scholar profile</a>.
          </p>
        </div>

        <div id="publications-container"></div>
      </div>
    </main>

    <footer>
      <div class="container">
        © <span id="current-year"></span> All rights reserved.
      </div>
    </footer>
  </div>

  <script src="data/publicationsData.js"></script>
  <script>
    // Group publications by year
    const publicationsByYear = {};
    publications.forEach(pub => {
      if (!publicationsByYear[pub.year]) {
        publicationsByYear[pub.year] = [];
      }
      publicationsByYear[pub.year].push(pub);
    });

    // Sort years in descending order
    const sortedYears = Object.keys(publicationsByYear)
      .map(Number)
      .sort((a, b) => b - a);

    // Render publications
    const container = document.getElementById('publications-container');
    
    sortedYears.forEach(year => {
      const yearSection = document.createElement('div');
      yearSection.className = 'publication-year';
      
      const yearHeading = document.createElement('h2');
      yearHeading.className = 'mb-6';
      yearHeading.textContent = year;
      yearSection.appendChild(yearHeading);
      
      publicationsByYear[year].forEach(pub => {
        const pubDiv = document.createElement('div');
        pubDiv.className = 'publication-item';
        
        const title = pub.link 
          ? `<h3 class="publication-title"><a href="${pub.link}">${pub.title}</a></h3>`
          : `<h3 class="publication-title">${pub.title}</h3>`;
        
        pubDiv.innerHTML = `
          ${title}
          <p class="publication-authors">${pub.authors}</p>
          <p class="publication-venue">${pub.venue}</p>
        `;
        
        yearSection.appendChild(pubDiv);
      });
      
      container.appendChild(yearSection);
    });

    document.getElementById('current-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
